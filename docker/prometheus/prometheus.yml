# ==============================================================================
# Prometheus Scrape Configuration for DeltaFlow
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "deltaflow-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["deltaflow-backend:8080"]
        labels:
          application: "delta-flow"
          environment: "production"
