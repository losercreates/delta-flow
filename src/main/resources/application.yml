spring:
  application:
    name: delta-flow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deltaflow}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: deltaflow-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  lifecycle:
    timeout-per-shutdown-phase: 30s

deltaflow:
  idempotency:
    enabled: true
    lease-ttl: 30s
    contender-poll-interval: 100ms
    contender-max-wait: 3s
    max-payload-size: 2097152 # 2MB
  redis:
    address: ${REDIS_URL:redis://localhost:6379}
  kafka:
    enabled: ${DELTAFLOW_KAFKA_ENABLED:false}
    domain-events-topic: ${DELTAFLOW_KAFKA_DOMAIN_EVENTS_TOPIC:deltaflow.domain-events}
    dlq-topic: ${DELTAFLOW_KAFKA_DLQ_TOPIC:deltaflow.domain-events.dlq}
    partitions: ${DELTAFLOW_KAFKA_PARTITIONS:3}
    replication-factor: ${DELTAFLOW_KAFKA_REPLICATION_FACTOR:1}
  webhook:
    secret: ${DELTAFLOW_WEBHOOK_SECRET:deltaflow-webhook-secret-key-default}
    timestamp-tolerance-seconds: ${DELTAFLOW_WEBHOOK_TIMESTAMP_TOLERANCE:300}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      enabled: ${OTEL_EXPORTER_OTLP_ENABLED:true}

