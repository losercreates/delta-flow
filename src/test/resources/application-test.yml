spring:
  application:
    name: delta-flow-test
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: deltaflow-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: localhost
      port: 6379

deltaflow:
  outbox:
    enabled: false
  kafka:
    enabled: ${DELTAFLOW_KAFKA_ENABLED:false}
    domain-events-topic: deltaflow.domain-events
    dlq-topic: deltaflow.domain-events.dlq
    partitions: 1
    replication-factor: 1
  webhook:
    secret: test-secret-key-12345
    timestamp-tolerance-seconds: 300
  idempotency:
    enabled: true
    lease-ttl: 3s
    contender-poll-interval: 50ms
    contender-max-wait: 1500ms
    max-payload-size: 2097152
  redis:
    address: redis://localhost:6379

logging:
  level:
    io.deltaflow: DEBUG
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

otel:
  exporter:
    otlp:
      enabled: false

