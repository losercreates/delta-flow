spring:
  application:
    name: delta-flow-test
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

deltaflow:
  idempotency:
    enabled: true
    lease-ttl: 3s
    contender-poll-interval: 50ms
    contender-max-wait: 1500ms
    max-payload-size: 2097152

logging:
  level:
    io.deltaflow: DEBUG
    org.flywaydb: INFO

